# The native backend, on every platform it is meant to reach — three native,
# and the same C as WebAssembly for a browser.
#
# What this is actually for: mdy-native is C, and the two engines under it are
# C, so "does it build elsewhere" is a question no amount of local testing on
# one machine answers. Windows is the reason this file exists — see
# docs/desktop-plan.md, Phase 4 — but macOS and Linux run too, because a
# Windows failure is only informative if the others are green.
#
# The checks are ordered so a failure says where it is:
#
#   1. it compiles                 — the toolchain and the C
#   2. `make check-parse`          — the front end's own checks: parser,
#                                    writer, script compiler, YAML, data fences
#   3. `make check-engine`         — the engine's own checks, twice: once
#                                    normally, once collecting at every GC
#                                    safe point
#   4. `make check-ingest`         — documents into nisaba
#   5. `make check-determinism`    — a golden site's output does not move
#   6. `make check-golden`         — byte-for-byte against committed output
#
# The last is the one that catches a path bug. A build that produces DIFFERENT
# pages rather than an error would pass every other check here, and on Windows
# that is the failure to expect: absolute paths are compared by string prefix
# to decide what is inside a package, and `path` is a natural key in nisaba.
#
# NOT here: `make check-sites`, which builds each site BOTH ways and diffs
# them. It is the strongest check there is, and it needs node to run mdy-docs
# — which needs lamassu.wasm and nisaba.wasm, emscripten build products that
# are not in git. That is the same reason the golden output is committed.
#
# The reference is committed (packages/mdy-native/golden/) rather than produced
# by running the node CLI alongside. The node path needs lamassu.wasm and
# nisaba.wasm, which are emscripten build products and are not in git, so on a
# Windows runner there would be nothing to compare against — and requiring an
# emscripten toolchain on three platforms to answer a question about C is the
# wrong trade. See that directory's README.

name: native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # a Windows failure must not hide a Linux one
      matrix:
        include:
          - { name: macOS,   os: macos-latest,  shell: bash }
          - { name: Linux,   os: ubuntu-latest, shell: bash }
          - { name: Windows, os: windows-latest, shell: 'msys2 {0}' }

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # MSYS2 rather than MSVC. The old reason was a dependency that would not
      # build under MSVC at all; that is gone, and what remains is the build
      # itself — a GNU makefile driving a Unix shell, with `make -C` into
      # lamassu. MSVC is now possible and would want a real build file
      # rather than a CI flag, which is a bigger decision than this job makes.
      - name: Set up MSYS2
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # The Windows PATH has to come through, or the node that
          # setup-node installs is invisible to this shell — `npm: command
          # not found`, which is what the first run said.
          path-type: inherit
          install: >-
            make
            mingw-w64-x86_64-gcc
            diffutils

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm install`, not `npm ci`. This package links eight sibling packages by
      # `file:` path — the engines, the bus, the editors — and their versions
      # move whenever a submodule does, which puts the lockfile out of sync and
      # makes `npm ci` fail for a reason that has nothing to do with what this
      # workflow is testing. The registry dependencies are still resolved
      # through the lockfile.
      # --ignore-scripts, and it is not belt-and-braces. `@mdy-docs/nisaba-db`
      # pulls in node-opfs, which pulls in fs-ext, which has a binding.gyp —
      # so a plain install runs node-gyp and fails on Windows for want of
      # Visual Studio. Nothing on this path uses it: the native backend
      # reaches the filesystem through C, and node is here only to run
      # esbuild, which resolves its platform binary from optionalDependencies
      # and needs no install script (verified).
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      # Both engines come from source. lamassu's archives are built by its own
      # Makefile; nisaba's sources are compiled directly by ours.
      - name: Build lamassu
        run: make -C third_party/lamassu-js libs

      - name: Build the engine
        working-directory: packages/mdy-native
        run: make build/mdy-build$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
        shell: bash

      # The front end alone: no node, no engine, no store. It is the port
      # of mdy-docs' parser, and these are its constructed cases; the
      # differential harnesses that hold it to the JavaScript over a real
      # corpus need node and a site, so they are not here (see below).
      - name: Run the front end's checks
        working-directory: packages/mdy-native
        run: make check-parse

      # The engine's own checks, run twice — the second pass collects at every
      # safe point. That is not belt-and-braces: this engine hands the VM
      # values it has just built, and one reachable only from the C stack is
      # invisible to the collector. Freeing it does not crash, it makes a
      # property silently become a different property.
      - name: Run the engine checks
        working-directory: packages/mdy-native
        run: make check-engine

      - name: Check documents reach the store
        working-directory: packages/mdy-native
        run: make check-ingest

      # A golden site whose output moves would go red for something that is not
      # a regression, so the property is proved rather than trusted: build,
      # touch every source, build again, diff.
      - name: Check the golden sites are deterministic
        working-directory: packages/mdy-native
        run: make check-determinism

      - name: Check against the golden output
        working-directory: packages/mdy-native
        run: make check-golden

      - name: Report the binary
        run: ls -l packages/mdy-native/build/mdy-build*

  # The fourth target: the same sources through emscripten, held to the same
  # golden output under node. See packages/mdy-native/wasm/README.md. A job
  # of its own rather than a matrix entry because its steps are different —
  # no native toolchain, one emsdk, and a node wrapper instead of a binary.
  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned to what nisaba's own CI pins, and what the wasm target was
      # first built with.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.7

      # AFTER emsdk, deliberately. setup-emsdk prepends the emsdk root to
      # PATH, and that directory holds a subdirectory named `node`, so a
      # `node` looked up through it is a directory — `make: node: Permission
      # denied`. setup-node running second puts the real one first.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the engine as WebAssembly
        working-directory: packages/mdy-native
        run: make wasm

      - name: Check against the golden output, under node
        working-directory: packages/mdy-native
        run: make check-wasm

      - name: Report the module
        run: ls -l packages/mdy-native/build/wasm/mdy-native.*

  # NOT HERE: mdy-docs' own 776 tests. They run the engines through
  # WebAssembly, and lamassu.wasm/nisaba.wasm are emscripten build products
  # that are not in git — so running them in CI means an emscripten toolchain,
  # which is a workflow of its own and not this one's question. This job asks
  # whether the NATIVE backend builds and is correct on three platforms; the
  # golden outputs above are how it knows the answer without node.
