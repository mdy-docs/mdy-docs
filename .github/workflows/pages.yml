name: Deploy playground to GitHub Pages

# Builds both WASM engines from the vendored submodules (Emscripten), builds
# the Vite playground against them, and publishes dist-web/ to GitHub Pages.
# Enable Pages in repo Settings → Pages with "Source: GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer run cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules — both engines live in third_party)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Keep in lockstep with nisaba-db's wasm/build-wasm.sh pin.
          version: 5.0.7
          actions-cache-folder: emsdk-cache

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify toolchain
        run: emcc --version && node --version

      - name: Build the template engine (lamassu-js package dist)
        run: make -C third_party/lamassu-js pkg

      - name: Build the database (nisaba-db wasm)
        run: third_party/nisaba-db/wasm/build-wasm.sh

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the playground (dist-web)
        run: npm run web:build

      - name: Sanity-check the artifacts exist
        run: test -f dist-web/index.html && ls dist-web/assets/*.wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
