<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta http-equiv="content-language" content="en">
    <meta name="description" content="Online mdy editor with live preview — document sets, data fences, and templates rendered as you type.">

    <script>
      (function(){
        try {
          var raw = localStorage.getItem('mdy-live-preview.theme');
          var useDark = raw === 'dark';
          document.documentElement.setAttribute('data-theme', useDark ? 'dark' : 'light');

          var link = document.createElement('link');
          link.id = 'gh-markdown-link';
          link.rel = 'stylesheet';
          link.type = 'text/css';
          link.href = useDark ? 'css/github-markdown-dark_dimmed.css' : 'css/github-markdown-light.css';
          document.head.appendChild(link);
        } catch (e) {
          // ignore — app will correct theme after load
        }
      })();
    </script>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <script type="module" src="/src/main.jsx"></script>
    <title>MDY Live Preview</title>
  </head>

  <body>
    <!-- The chrome that used to live here — header, panes, divider — is now
         App.jsx. The inline theme script above stays: it runs before first
         paint, which React cannot. -->
    <div id="root"></div>
  </body>
</html>
