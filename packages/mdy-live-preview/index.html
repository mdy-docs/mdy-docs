<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta http-equiv="content-language" content="en">
    <meta name="description" content="Online mdy editor with live preview — document sets, data fences, and templates rendered as you type.">

    <script>
      (function(){
        try {
          var raw = localStorage.getItem('mdy-live-preview.theme');
          var useDark = raw === 'dark';
          document.documentElement.setAttribute('data-theme', useDark ? 'dark' : 'light');

          var link = document.createElement('link');
          link.id = 'gh-markdown-link';
          link.rel = 'stylesheet';
          link.type = 'text/css';
          link.href = useDark ? 'css/github-markdown-dark_dimmed.css' : 'css/github-markdown-light.css';
          document.head.appendChild(link);
        } catch (e) {
          // ignore — app will correct theme after load
        }
      })();
    </script>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <script type="module" src="/src/main.js"></script>
    <title>MDY Live Preview</title>
  </head>

  <body>

    <header>
        <div id="menu-items">
            <div><a href="/">MDY Live Preview</a></div>
            <div id="reset-button"><a href="#">Reset</a></div>
            <div id="copy-button"><a href="#">Copy</a></div>
            <div id="sync-button">
              <input type="checkbox" id="sync-scroll-checkbox"><label for="sync-scroll-checkbox">Sync scroll</label>
              <span style="margin-left:12px;"><input type="checkbox" id="theme-checkbox"><label for="theme-checkbox">Dark mode</label></span>
            </div>
        </div>
        <div id="github"><a href="https://github.com/belteshazzar/mdy-docs"><img src="image/GitHub-Mark-Light-32px.webp"></a></div>
    </header>

    <div id="container" class="split-container">

        <div id="edit" class="column editor-pane">
            <div id="editor-wrapper">
                <div id="editor"></div>
            </div>
        </div>

        <div id="split-divider" class="split-divider"></div>

        <div id="preview" class="column preview-pane">
            <div id="preview-wrapper">
                <div id="output" class="content markdown-body"></div>
            </div>
        </div>
    </div>

  </body>
</html>
